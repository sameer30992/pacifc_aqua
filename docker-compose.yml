services:
  mysql:
    image: mysql:8.0
    container_name: pacific-aqua-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pacific_aqua
      MYSQL_USER: pacific
      MYSQL_PASSWORD: pacific
    volumes:
      - pacific_aqua_mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pacific_aqua_mysql:
