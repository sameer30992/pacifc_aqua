server:
  port: 8080

spring:
  application:
    name: pacific-aqua-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/pacific_aqua?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: pacific
    password: pacific
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        type:
          preferred_enum_jdbc_type: VARCHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: pacific-aqua-dev-secret-change-me-32chars-min
    access-token-minutes: 480
    refresh-token-days: 30
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080"

logging:
  level:
    org.springframework.security: INFO
